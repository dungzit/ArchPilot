# ArchPilot CI (repo root = this folder, github.com/dungzit/ArchPilot).
#
#   backend   ruff check  ->  pytest                              (backend/)
#   frontend  tsc -b      ->  vitest  ->  tsc -b && vite build    (repo root)
#
# Version pinning matches the images we ship:
#   * Python 3.12 -> backend/Dockerfile runtime stage is python:3.12-slim.
#     3.10 stays as a second leg because the build scope still says "3.10+".
#   * Node 24     -> both Dockerfile SPA build stages are node:24-alpine.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.10']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Record the interpreter and SQLite build
        run: |
          python -VV
          python -c "import sqlite3; print('sqlite3', sqlite3.sqlite_version)"
          python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute(\"CREATE VIRTUAL TABLE t USING fts5(x, tokenize='unicode61 remove_diacritics 2')\"); print('fts5 + unicode61 remove_diacritics 2: ok')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  frontend:
    name: frontend (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc -b, strict)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Fail if the build produced nothing
        run: test -f dist/index.html
